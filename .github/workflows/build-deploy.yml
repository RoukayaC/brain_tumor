name: Build and Deploy to GKE

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".gitattributes"
      # Ignore changes outside the flask directory or this workflow file
      - '!flask/**' 
      - '!.github/workflows/build-deploy.yml' 
  workflow_dispatch: # Allows manual triggering
    inputs:
      environment:
        description: "Environment to deploy to (namespace)"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - dev
          # Add test if you have a test env setup

# --- Global Environment Variables ---
env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}          
  REPO_NAME: brain-tumor-repo             
  IMAGE_NAME: brain-tumor-api            
  CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME || 'brain-tumor-cluster' }}
  NAMESPACE: ${{ github.event.inputs.environment || 'prod' }} 
  GCS_BUCKET_NAME_BASE: "brain-tumor-model-bucket-kubs" 

jobs:
  build-push-deploy:
    name: Build, Push, and Deploy to ${{ github.event.inputs.environment || 'prod' }}
    runs-on: ubuntu-latest

    
    permissions:
      contents: 'read'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 
        with:
          lfs: true 

      - name: Verify model and classes files in ./flask
        run: |
          FLASK_DIR="./flask" 
          MODEL_DIR="./models/comparison" 
          DATA_DIR="./data" 

          mkdir -p $FLASK_DIR 

          if [ ! -f "$FLASK_DIR/best_model.keras" ]; then
            echo "Model not found in $FLASK_DIR."
            if [ -f "$MODEL_DIR/best_model_for_deployment.keras" ]; then
              echo "Copying model from $MODEL_DIR to $FLASK_DIR"
              cp "$MODEL_DIR/best_model_for_deployment.keras" "$FLASK_DIR/best_model.keras"
            else
              echo "::warning::Model file not found, assuming it will be loaded from GCS."
            fi
          else 
            echo "Model file already exists in $FLASK_DIR."
          fi

          if [ ! -f "$FLASK_DIR/classes.txt" ]; then
            echo "Classes file not found in $FLASK_DIR."
            CLASSES_SRC=$(find $DATA_DIR -name classes.txt -print -quit) 
            if [ -n "$CLASSES_SRC" ]; then
               echo "Copying classes file from $CLASSES_SRC to $FLASK_DIR"
               cp "$CLASSES_SRC" "$FLASK_DIR/classes.txt"
            else 
               echo "::error::Required classes.txt file not found in $DATA_DIR or $FLASK_DIR!"
               exit 1 
            fi
          else
            echo "Classes file already exists in $FLASK_DIR."
          fi

          echo "Contents of $FLASK_DIR directory:"
          ls -la $FLASK_DIR/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - id: 'auth'
        name: 'Authenticate to Google Cloud (SA Key)'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin" 

      - name: Configure GCP Services
        run: |
          echo "Enabling necessary APIs..."
          gcloud services enable container.googleapis.com artifactregistry.googleapis.com --project=${{ env.PROJECT_ID }}

          echo "Configuring Docker for Artifact Registry..."
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

          echo "Ensuring Artifact Registry Repository exists..."
          gcloud artifacts repositories create ${{ env.REPO_NAME }} \
            --project=${{ env.PROJECT_ID }} \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --description="Brain Tumor API Docker repository" || true
        
      - name: Set image tag
        id: set_tags
        run: |
          IMAGE_TAG="v-$(date +'%Y%m%d')-${GITHUB_SHA::7}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "Using image tag: ${IMAGE_TAG}"

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5 
        with:
          context: ./flask 
          file: ./flask/Dockerfile.prod 
          push: true 
          tags: | 
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest-${{ env.NAMESPACE }}
          cache-from: type=gha 
          cache-to: type=gha,mode=max

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2 
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.REGION }} 

      - name: Deploy to Kubernetes GKE
        run: |
          echo "Deploying image ${{ env.IMAGE_TAG }} to namespace ${{ env.NAMESPACE }}..."

          # --- Prepare deployment files ---
          cd ./flask 

          DEPLOY_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "Using image: $DEPLOY_IMAGE"
          
          EXPECTED_GCS_BUCKET_NAME="${{ env.GCS_BUCKET_NAME_BASE }}"
          echo "Expecting GCS Bucket: $EXPECTED_GCS_BUCKET_NAME"

          # --- Use sed to update placeholders in YAML files ---          
          sed -i "s|image: \${PROD_IMAGE_URI}|image: ${DEPLOY_IMAGE}|g" deployment.yaml
          sed -i "s|value: \"YOUR_GCS_BUCKET_NAME_PLACEHOLDER\"|value: \"${EXPECTED_GCS_BUCKET_NAME}\"|g" deployment.yaml
          sed -i "s|env: prod|env: ${{ env.NAMESPACE }}|g" deployment.yaml service.yaml
          sed -i "s|namespace: prod|namespace: ${{ env.NAMESPACE }}|g" deployment.yaml service.yaml

          echo "--- Modified deployment.yaml ---"
          cat deployment.yaml
          echo "------------------------------"
          echo "--- Modified service.yaml ---"
          cat service.yaml
          echo "------------------------------"

          # --- Apply Kubernetes configurations ---
          echo "Applying Kubernetes manifests to namespace: ${{ env.NAMESPACE }}"
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f deployment.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f service.yaml -n ${{ env.NAMESPACE }}

          # --- Verify deployment ---
          echo "Waiting for deployment rollout to complete..."
          kubectl rollout status deployment/brain-tumor-api-deployment -n ${{ env.NAMESPACE }} --timeout=5m 

          echo "Deployment completed successfully!"
          echo "Fetching external IP for service..."
          sleep 15 
          EXTERNAL_IP=$(kubectl get service brain-tumor-api-service -n ${{ env.NAMESPACE }} -o jsonpath="{.status.loadBalancer.ingress[0].ip}")
          if [ -z "$EXTERNAL_IP" ]; then
             echo "::warning::Could not get external IP automatically. Check 'kubectl get service -n ${{ env.NAMESPACE }}' manually."
          else
             echo "Service URL: http://${EXTERNAL_IP}"
          fi